        type: string
      password:
        example: learning-go-auth-2026
        type: string
    required:
    - login
    - password
    type: object
  internal_features_auth_transport_http.LoginResponse:
    properties:
      access_token:
        description: 'AccessToken — JWT для заголовка Authorization: Bearer <access_token>.'
        type: string
      refresh_token:
        description: 'RefreshToken — непрозрачный одноразовый токен: 43 символа Base64URL
          без padding.'
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  internal_features_auth_transport_http.LogoutRequest:
    properties:
      refresh_token:
        description: 'RefreshToken — непрозрачный одноразовый токен: 43 символа Base64URL
          без padding.'
        type: string
    type: object
  internal_features_auth_transport_http.RefreshRequest:
    properties:
      refresh_token:
        description: 'RefreshToken — непрозрачный одноразовый токен: 43 символа Base64URL
          без padding.'
        type: string
    type: object
  internal_features_auth_transport_http.RefreshResponse:
    properties:
      access_token:
        description: 'AccessToken — JWT для заголовка Authorization: Bearer <access_token>.'
        type: string
      refresh_token:
        description: 'RefreshToken — непрозрачный одноразовый токен: 43 символа Base64URL
          без padding.'
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  internal_features_auth_transport_http.RegisterRequest:
    properties:
      full_name:
        example: Ivan Petrov
        type: string
      login:
        example: auth_test
        type: string
      password:
        description: Password должен содержать минимум 15 символов и максимум 72 байта
          UTF-8.
        example: learning-go-auth-2026
        type: string
      phone_number:
        example: "+79998887766"
        type: string
    required:
    - full_name
    - login
    - password
    type: object
  internal_features_auth_transport_http.RegisterResponse:
    properties:
      full_name:
        example: Ivan Petrov
        type: string
      id:
        example: 42
        type: integer
      phone_number:
