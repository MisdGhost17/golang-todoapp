host: 127.0.0.1:5050
info:
  contact: {}
  description: ToDo Application REST API
  title: Golang ToDo API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Проверяет логин и пароль, создаёт новую сессию и выдаёт пару токенов.
        Access JWT действует 15 минут, refresh-сессия — 30 дней. Токены передаются
        в JSON, cookie не устанавливается. Для неизвестного логина и неверного пароля
        возвращается одинаковая ошибка.
      parameters:
      - description: Тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_auth_transport_http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Пара токенов
          headers:
            Cache-Control:
              description: no-store
              type: string
          schema:
            $ref: '#/definitions/internal_features_auth_transport_http.LoginResponse'
        "400":
          description: Некорректный JSON
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Неверный логин или пароль
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      summary: Вход
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Отзывает сессию по refresh-токену, в том числе использованному.
        Access JWT не требуется. Повторный выход, неизвестный или некорректный токен
        возвращают 204. Уже выданный access JWT действует до истечения срока. Клиент
        должен удалить оба токена.
      parameters:
      - description: Тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_auth_transport_http.LogoutRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Сессия отозвана или токен не найден; тело отсутствует
          headers:
            Cache-Control:
              description: no-store
              type: string
        "400":
          description: Некорректный JSON
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Не удалось отозвать сессию
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      summary: Выход из сессии
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Обменивает refresh-токен на новую пару. Access JWT не требуется.
        Старый refresh-токен становится использованным; повторное использование отзывает
        всю сессию. Срок сессии не продлевается. Не отправляйте параллельные запросы
        и не повторяйте запрос автоматически при потере ответа.
      parameters:
      - description: Тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_auth_transport_http.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Новая пара токенов
          headers:
            Cache-Control:
              description: no-store
              type: string
          schema:
            $ref: '#/definitions/internal_features_auth_transport_http.RefreshResponse'
        "400":
          description: Некорректный JSON
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Токен недействителен, истёк, использован или сессия отозвана
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      summary: Обновление токенов
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: 'Создаёт профиль и данные входа атомарно. Логин нормализуется:
        пробелы по краям удаляются, регистр приводится к нижнему. Пароль: минимум
        15 символов, максимум 72 байта. Токены не выдаются.'
      parameters:
      - description: Тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_auth_transport_http.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Профиль создан
          schema:
            $ref: '#/definitions/internal_features_auth_transport_http.RegisterResponse'
        "400":
          description: Некорректные данные
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Логин уже занят
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      summary: Регистрация
      tags:
      - auth
  /statistics:
    get:
      description: |-
        Получение статистики задач с опциональными фильтрами по пользователю и периоду.
        В текущей конфигурации JWT не требуется. Без user_id возвращается общая статистика.
      parameters:
      - description: ID пользователя
        in: query
        name: user_id
        type: integer
      - description: Начало периода по created_at включительно, YYYY-MM-DD
        format: date
        in: query
        name: from
        type: string
      - description: Конец периода по created_at исключительно, YYYY-MM-DD; позже
          from
        format: date
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Статистика задач
          schema:
            $ref: '#/definitions/internal_features_statistics_transport_http.GetStatisticsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      summary: Получение статистики задач
      tags:
      - statistics
  /tasks:
    get:
      description: Получение задач текущего пользователя с пагинацией. Параметр user_id
        игнорируется. Без limit возвращаются все свои задачи.
      parameters:
      - description: Максимальное количество задач
        in: query
        minimum: 0
        name: limit
        type: integer
      - description: Количество пропускаемых задач
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Список задач
          schema:
            items:
              $ref: '#/definitions/internal_features_tasks_transport_http.TaskDTOResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение списка задач
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: Создание задачи текущего пользователя. Автор определяется по JWT;
        author_user_id из тела запроса игнорируется.
      parameters:
      - description: Данные новой задачи
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Задача успешно создана
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Author User Not Found
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создание задачи
      tags:
      - tasks
  /tasks/{id}:
    delete:
      description: Удаление своей задачи по ID. Для чужой или отсутствующей задачи
        возвращается 404.
      parameters:
      - description: ID удаляемой задачи
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Задача успешно удалена
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Task Not Found
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удаление задачи
      tags:
      - tasks
    get:
      description: Получение своей задачи по ID. Для чужой или отсутствующей задачи
        возвращается 404.
      parameters:
      - description: ID задачи
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Задача успешно найдена
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.GetTaskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Task Not Found
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение задачи
      tags:
      - tasks
    patch:
      consumes:
      - application/json
      description: |-
        Частичное изменение своей задачи по ID. Для чужой или отсутствующей задачи возвращается 404. Непереданные поля сохраняют текущие значения.
        Поле description допускает null для удаления описания. Поля title и completed не допускают null.
        Длина title: от 1 до 100 символов; description: от 1 до 1000 символов, если передана строка.
      parameters:
      - description: ID изменяемой задачи
        in: path
        name: id
        required: true
        type: integer
      - description: Изменяемые поля задачи
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_tasks_transport_http.PatchTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Задача успешно изменена
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.PatchTaskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Task Not Found
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Изменение задачи
      tags:
      - tasks
  /users:
    get:
      description: |-
        Получение списка пользователей с опциональной пагинацией
        В текущей конфигурации маршрут доступен без JWT.
      parameters:
      - description: Размер страницы; без параметра возвращаются все пользователи
        in: query
        minimum: 0
        name: limit
        type: integer
      - description: Смещение страницы с пользователями
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешное получение списка пользователей
          schema:
            items:
              $ref: '#/definitions/internal_features_users_transport_http.UserDTOResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MisdGhost17_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      summary: Получение пользователей
